# MetaIntel Platform – Nginx API Gateway
# Handles: HTTP proxying, rate limiting, and routing for Laravel + Frontend

# ─── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=upload_limit:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m       rate=120r/m;
limit_req_zone $binary_remote_addr zone=batch_limit:10m     rate=3r/m;
limit_req_zone $http_x_api_key     zone=apikey_limit:10m    rate=300r/m;

# ─── Upstream definitions ─────────────────────────────────────────────────────
upstream laravel_fpm {
    server laravel-api:9000;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 16;
}

# ─── Gzip compression ─────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;

# ─── Server – HTTP main ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # File upload limit (max image size)
    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"        always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "strict-origin"     always;
    add_header Permissions-Policy        "geolocation=()"    always;

    # ── Laravel API ────────────────────────────────────────────────────────────
    location /api {
        limit_req zone=api_limit burst=30 nodelay;

        # Strip /api prefix and forward to Laravel
        fastcgi_pass   laravel_fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param  REQUEST_URI     $request_uri;
        include        fastcgi_params;

        # Timeouts for long-running requests
        fastcgi_read_timeout   300s;
        fastcgi_send_timeout   300s;
        fastcgi_connect_timeout 10s;

        # Buffer settings
        fastcgi_buffer_size    128k;
        fastcgi_buffers        8 128k;
    }

    # ── Upload endpoint – stricter rate limit ─────────────────────────────────
    location /api/v1/images/upload {
        limit_req zone=upload_limit burst=5 nodelay;

        fastcgi_pass  laravel_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include       fastcgi_params;

        fastcgi_read_timeout 120s;
        client_max_body_size 100M;
    }

    # ── Batch upload endpoint ─────────────────────────────────────────────────
    location /api/v1/images/batch-upload {
        limit_req zone=batch_limit burst=2 nodelay;

        fastcgi_pass  laravel_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include       fastcgi_params;

        fastcgi_read_timeout 600s;
        client_max_body_size 500M;
    }

    # ── Laravel Horizon dashboard ─────────────────────────────────────────────
    location /horizon {
        # Restrict to internal IPs in production
        # allow 10.0.0.0/8;
        # deny all;

        fastcgi_pass  laravel_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        include       fastcgi_params;
    }

    # ── Static assets (served by Nginx directly) ──────────────────────────────
    location /storage {
        alias /var/www/storage/app/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";

        # Security: block executable files
        location ~* \.(php|sh|py|pl|rb|exe)$ {
            deny all;
        }
    }

    # ── Frontend (Next.js) ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout  60s;
        proxy_connect_timeout 10s;
    }

    # ── Deny hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location /nginx-health {
        access_log off;
        return 200 'healthy';
        add_header Content-Type text/plain;
    }
}
